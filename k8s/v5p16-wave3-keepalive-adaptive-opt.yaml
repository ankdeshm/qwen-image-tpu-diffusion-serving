apiVersion: batch/v1
kind: Job
metadata:
  name: v5p16-wave3-keepalive-adaptive-opt
  namespace: default
  labels:
    app: v5p16-wave3-keepalive-adaptive-opt
    suite: omni-world-portfolio-wave3
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 12
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        app: v5p16-wave3-keepalive-adaptive-opt
        suite: omni-world-portfolio-wave3
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 15
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-queued"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: tpu-bench
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/vllm-torchtpu-omni:v0.32.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PJRT_DEVICE
          value: "TPU"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
        - name: MULTIMODAL_CPU_OFFLOAD_URL
          value: "http://multimodal-cpu-offload-svc.default.svc.cluster.local:8090"
        - name: ADAPTIVE_OFFLOAD_MIN_BYTES
          value: "262144"
        resources:
          requests:
            google.com/tpu: "4"
            memory: "350Gi"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          ulimit -c 0 || true
          mount -o remount,size=380G /dev/shm || true
          rm -rf /dev/shm/* /dev/shm/.[!.]* /dev/shm/..?* 2>/dev/null || true
          mkdir -p /dev/shm/tmp /dev/shm/hf_cache /dev/shm/uv_cache /dev/shm/pip_cache /dev/shm/torchinductor /tmp/omni_bench
          BUCKET="YOUR_GCS_BUCKET"
          TOK=$(curl -sS -H "Metadata-Flavor: Google" \
            "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          for SCRIPT in gcs_stager.py tpu_single_host_setup.py cpu_offload_client.py \
            run_gr00t_vla_tpu_bench.py run_qwen_image_tpu_bench.py \
            run_cosmos3_super_tpu_bench.py run_hunyuan_image3_tpu_bench.py; do
            curl -fsSL --retry 4 --retry-delay 2 -H "Authorization: Bearer ${TOK}" \
              "https://storage.googleapis.com/storage/v1/b/${BUCKET}/o/omni-world-portfolio%2Fscripts%2F${SCRIPT}?alt=media" \
              -o "/tmp/omni_bench/${SCRIPT}"
          done
          IDX="${JOB_COMPLETION_INDEX:-0}"
          unset JOB_COMPLETION_INDEX
          case "${IDX}" in
            0)
              echo "[wave3-v5p16-host-0] GR00T-N1.7-3B w/ Persistent HTTP/1.1 Keep-Alive + TCP_NODELAY Vision Offload..."
              python3 -u /tmp/omni_bench/run_gr00t_vla_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16-wave3-keepalive --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/gr00t-n1-7-3b
              ;;
            1)
              echo "[wave3-v5p16-host-1] Qwen-Image + Qwen-Image-2.1 w/ Persistent Keep-Alive + Adaptive Threshold Offload..."
              python3 -u /tmp/omni_bench/run_qwen_image_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16-wave3-keepalive --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/qwen-image
              ;;
            2)
              echo "[wave3-v5p16-host-2] Cosmos3-Super w/ Persistent Keep-Alive + TCP_NODELAY H.264+AAC Offload..."
              python3 -u /tmp/omni_bench/run_cosmos3_super_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16-wave3-keepalive --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/cosmos3-super
              ;;
            3)
              echo "[wave3-v5p16-host-3] HunyuanImage-3.0 w/ Persistent Keep-Alive + TCP_NODELAY PNG Offload..."
              python3 -u /tmp/omni_bench/run_hunyuan_image3_tpu_bench.py \
                --chip-type=v5p --slice-name=v5p-16-wave3-keepalive --num-hosts=4 --cores-per-host=4 \
                --bucket="${BUCKET}" --use-shm --output-dir=/tmp/omni_bench/results/hunyuan-image-3
              ;;
          esac
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
